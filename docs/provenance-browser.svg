<text x="30" y="392" font-size="19">
<tspan x="30" dy="0">Rights boundary: earlier MIT label conflicts with missing license text.</tspan>
<tspan x="30" dy="23.75">PDF/DOCX retain Proprietary notices; frontend terms file is also absent.</tspan>
</text>
<text x="30" y="472" font-size="21">
<tspan x="30" dy="0">02  Standalone control paths — inferred from source, NOT RUN</tspan>
</text>
<text x="48" y="536" font-size="19">
<tspan x="48" dy="0">CLIENT SCRIPTS</tspan>
<tspan x="48" dy="23.75">TypeScript + Playwright</tspan>
<tspan x="48" dy="23.75">Named pages / snapshots</tspan>
</text>
<text x="388" y="536" font-size="19">
<tspan x="388" dy="0">HTTP PAGE API :9222</tspan>
<tspan x="388" dy="23.75">Registry + CDP discovery</tspan>
<tspan x="388" dy="23.75">No route auth observed</tspan>
</text>
<text x="728" y="536" font-size="19">
<tspan x="728" dy="0">CHROMIUM CDP :9223</tspan>
<tspan x="728" dy="23.75">Persistent browser context</tspan>
<tspan x="728" dy="23.75">Page interaction / content</tspan>
</text>
<text x="270" y="637" font-size="17">
<tspan x="270" dy="0">Playwright connects over CDP</tspan>
</text>
<text x="728" y="729" font-size="19">
<tspan x="728" dy="0">SENSITIVE LOCAL STATE</tspan>
<tspan x="728" dy="23.75">profiles/browser-data</tspan>
<tspan x="728" dy="23.75">Cookies, storage, cache</tspan>
</text>
<text x="48" y="729" font-size="19">
<tspan x="48" dy="0">OPTIONAL, SEPARATE MODE</tspan>
<tspan x="48" dy="23.75">Client → relay :9222 → external extension → existing Chrome</tspan>
<tspan x="48" dy="23.75">Not bundled or runtime-verified; explicit opt-in only</tspan>
</text>
<text x="30" y="854" font-size="19">
<tspan x="30" dy="0">PRIVACY / NETWORK BOUNDARY</tspan>
<tspan x="30" dy="23.75">Do not expose API/CDP to untrusted networks. Isolate ports and profiles.</tspan>
<tspan x="30" dy="23.75">Keep login state, page extracts, screenshots and endpoint details private.</tspan>
<tspan x="30" dy="23.75">Startup may install packages/browser and kill a process on port 9223.</tspan>
</text>
<text x="30" y="979" font-size="17">
<tspan x="30" dy="0">Documentation cleanup: AI-assisted by Reason. Inherited authorship unchanged.</tspan>
